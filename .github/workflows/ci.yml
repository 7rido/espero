name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catch dependency drift before it reaches a laptop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # lean: the package as most installs see it, with every optional library absent, so a test that quietly
          # needs one is caught; scripts/check.sh repeats this run on the Mac with those libraries hidden
          - python: "3.10"
            extras: "chart,dev"
          # full: the home screen and the answer form (tui), and the raw tape's readers (raw), tested for real
          - python: "3.12"
            extras: "chart,dev,tui,raw"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extras }}]"

      - name: Lint
        run: ruff check espero tests research

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Reproduce the audit table
        run: espero matrix

      - name: CLI smoke test
        run: |
          espero --version
          espero backtest --fee-bps 60
          espero daily --dry-run --state-dir /tmp/espero-ci
